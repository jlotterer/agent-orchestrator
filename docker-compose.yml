services:
  orch:
    build: .
    image: orch:local
    container_name: orch
    # Run an init process as PID 1 so orphaned agent processes are reaped. Without it, a test
    # suite that kills background processes (orch's own e2e lifecycle tests, for one) hangs.
    init: true
    restart: unless-stopped
    ports:
      # Reachable from other machines. For localhost-only access use "127.0.0.1:4800:4800".
      - "4800:4800"
    environment:
      # Access token for the dashboard, API and CLI. Required: the container listens on 0.0.0.0
      # so the published port works, and orch refuses that without a token (decision 0014).
      # Generate one with `openssl rand -hex 32` and put it in .env. `docker compose exec orch orch …`
      # picks it up from this environment automatically.
      - ORCH_TOKEN=${ORCH_TOKEN:-}
      # Claude Code auth. No API key needed: run `docker compose run --rm orch claude auth login`
      # once to use your Claude subscription (saved in the claude-home volume), or set a
      # long-lived token from `claude setup-token` here. Only set ANTHROPIC_API_KEY if you
      # want per-token API billing instead.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # Gemini CLI (only if a role uses the gemini adapter): an API key, or log in once with
      # `docker compose run --rm orch gemini` and the login is kept in the gemini-home volume.
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      # GitHub (for git.pr: true): a token with repo scope
      - GH_TOKEN=${GH_TOKEN:-}
      # Git identity used by workers' commits
      - GIT_AUTHOR_NAME=${GIT_AUTHOR_NAME:-orch}
      - GIT_AUTHOR_EMAIL=${GIT_AUTHOR_EMAIL:-orch@localhost}
      - GIT_COMMITTER_NAME=${GIT_AUTHOR_NAME:-orch}
      - GIT_COMMITTER_EMAIL=${GIT_AUTHOR_EMAIL:-orch@localhost}
    volumes:
      # Everything orch touches lives under /work (ORCH_HOME): server.json, orch.db, worktrees, your repos.
      - ./work:/work
      # Claude Code login + settings (survives rebuilds)
      - claude-home:/home/orch/.claude
      - gemini-home:/home/orch/.gemini
      # gh login (if you prefer `gh auth login` over GH_TOKEN)
      - gh-config:/home/orch/.config/gh
      # Uncomment to push over SSH instead of HTTPS:
      # - ~/.ssh:/home/orch/.ssh:ro

volumes:
  claude-home:
  gemini-home:
  gh-config:
