<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>orch</title>
<style>
:root {
  --bg: #0f1115; --panel: #161a21; --panel2: #1c2129; --line: #262c36; --text: #e6e8ec; --muted: #8b93a1; --dim: #5d6572;
  --accent: #7aa2f7; --ok: #4fd18b; --warn: #f0b35b; --bad: #f36c6c; --info: #9d7cf5; --run: #4fc3f7;
  --add-fg: #4fd18b; --del-fg: #f36c6c; --add-bg: rgba(79, 209, 139, .12); --del-bg: rgba(243, 108, 108, .12); --hunk-fg: #9d7cf5;
  --mono: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
  --sans: -apple-system, "Segoe UI", Inter, Roboto, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root { color-scheme: light; --bg: #f4f5f7; --panel: #ffffff; --panel2: #f0f2f5; --line: #dfe3e8; --text: #1b1f27; --muted: #5d6572; --dim: #8b93a1;
    --add-fg: #1a7f37; --del-fg: #cf222e; --add-bg: #e6ffec; --del-bg: #ffebe9; --hunk-fg: #6f42c1; }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.45 var(--sans); }
a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
button { font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
button:hover { border-color: var(--muted); } button:disabled { opacity: .4; cursor: default; }
button.primary { background: var(--accent); color: #0b0e14; border-color: transparent; font-weight: 600; }
button.danger { color: var(--bad); } button.good { color: var(--ok); } button.small { padding: 2px 8px; font-size: 12px; }
input, textarea, select { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
textarea { width: 100%; min-height: 64px; font-family: var(--mono); font-size: 12px; }
code, .mono { font-family: var(--mono); font-size: 12px; }
.pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; letter-spacing: .02em; text-transform: uppercase; border: 1px solid transparent; }
.s-pending { color: var(--muted); border-color: var(--line); }
.s-running { color: var(--run); border-color: var(--run); }
.s-validating { color: var(--info); border-color: var(--info); }
.s-needs_input { color: var(--warn); border-color: var(--warn); background: color-mix(in srgb, var(--warn) 12%, transparent); }
.s-pr_open { color: var(--accent); border-color: var(--accent); }
.s-pr_checks { color: var(--info); border-color: var(--info); }
.ci { font-family: var(--mono); font-size: 11px; } .ci.pass { color: var(--ok); } .ci.fail { color: var(--bad); } .ci.pending { color: var(--info); } .ci.none { color: var(--dim); }
.s-failed { color: var(--bad); border-color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, transparent); }
.s-done { color: var(--ok); border-color: var(--ok); }
.s-skipped { color: var(--dim); border-color: var(--line); text-decoration: line-through; }
.s-plan_pending, .s-planning { color: var(--warn); border-color: var(--warn); }
.s-ready, .s-paused, .s-stopped { color: var(--muted); border-color: var(--muted); }
.s-passed { color: var(--ok); border-color: var(--ok); }
.s-needs_human { color: var(--bad); border-color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, transparent); }
.fixup { color: var(--warn); border-color: var(--warn); }

body { display: flex; flex-direction: column; }
#top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 7; }
#top h1 { font-size: 15px; margin: 0; font-weight: 700; letter-spacing: .04em; }
#top h1 span { color: var(--accent); }
#runInfo { min-width: 0; }
#runTitle { font-weight: 600; overflow-wrap: anywhere; } #runMeta { color: var(--muted); font-size: 12px; }
#usage { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 3px 9px; }
#usage b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
#controls { margin-left: auto; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
#runSel { max-width: 260px; }
#live { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); } #live.on { background: var(--ok); box-shadow: 0 0 8px var(--ok); } #live.retry { background: var(--warn); }
/* project switcher (REQ-PROJ-03) */
#proj { position: relative; }
#projectSwitcher { display: flex; align-items: center; gap: 8px; max-width: 260px; }
#projectSwitcher .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#projectSwitcher .caret { color: var(--muted); font-size: 11px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); flex: none; }
.dot.running { background: var(--run); } .dot.attn { background: var(--warn); } .dot.done { background: var(--ok); } .dot.idle { background: var(--muted); } .dot.bad { background: var(--bad); }
.badge { background: var(--warn); color: #0b0e14; border-radius: 999px; padding: 0 7px; font-size: 11px; font-weight: 700; flex: none; }
#projectMenu { position: absolute; top: calc(100% + 6px); left: 0; width: 320px; max-width: calc(100vw - 32px); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.3); padding: 6px; z-index: 10; }
#projectList { max-height: 50vh; overflow: auto; }
.pitem { display: flex; width: 100%; gap: 8px; align-items: center; background: none; border: 0; border-radius: 6px; text-align: left; padding: 6px 8px; }
.pitem:hover, .pitem.cur { background: var(--panel2); } .pitem .pn { flex: 1; min-width: 0; }
.pitem .pn div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .pitem .meta { color: var(--muted); font-size: 11px; }
.menu-actions { display: flex; gap: 6px; justify-content: space-between; border-top: 1px solid var(--line); margin-top: 6px; padding-top: 6px; }
.ptag { display: inline-block; max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: bottom; font-size: 11px; font-weight: 600; color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); border-radius: 4px; padding: 0 5px; margin-right: 4px; }
.card.inb { cursor: pointer; } .card.inb.here { border-left: 3px solid var(--accent); }
#projectError { background: color-mix(in srgb, var(--bad) 10%, var(--panel)); border: 1px solid color-mix(in srgb, var(--bad) 45%, transparent); border-radius: 8px; padding: 14px 16px; max-width: 720px; }
#projectError.plain { background: var(--panel); border-color: var(--line); }
#projectError h3 { margin: 0 0 6px; font-size: 14px; } #projectError p { margin: 6px 0; color: var(--muted); }
#projectError .why { color: var(--text); font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }
.err { color: var(--bad); min-height: 1.2em; margin-top: 6px; font-size: 13px; overflow-wrap: anywhere; }

#layout { display: grid; grid-template-columns: 300px 1fr; gap: 0; flex: 1; min-height: 0; }
#layout.has-detail { grid-template-columns: 300px 1fr 420px; }
#detail { display: none; } #layout.has-detail #detail { display: block; }
@media (max-width: 1250px) { #layout.has-detail { grid-template-columns: 300px 1fr; } #layout.has-detail #detail { position: fixed; right: 0; top: 0; bottom: 0; width: min(520px, 100vw); z-index: 8; box-shadow: -8px 0 24px rgba(0,0,0,.4); } }
@media (max-width: 760px) {
  body { display: block; }
  #layout, #layout.has-detail { grid-template-columns: 1fr; }
  #inbox { border-right: 0; border-bottom: 1px solid var(--line); max-height: 40vh; }
  #controls { margin-left: 0; width: 100%; }
  #runSel { max-width: 100%; flex: 1 1 100%; }
  #projectMenu { position: fixed; top: 52px; left: 16px; right: 16px; width: auto; max-width: none; }
}
.col { overflow: auto; min-width: 0; }
#inbox { border-right: 1px solid var(--line); background: var(--panel); padding: 12px; }
#main { padding: 12px 16px; }
#detail { border-left: 1px solid var(--line); background: var(--panel); padding: 12px 14px; overflow: auto; }
h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 8px; display: flex; align-items: center; gap: 8px; }
h2 .count { background: var(--warn); color: #0b0e14; border-radius: 999px; padding: 0 7px; font-size: 11px; }
.card { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin-bottom: 8px; }
.card.hot { border-color: var(--warn); }
.card .t { font-weight: 600; margin-bottom: 4px; }
.card .d { color: var(--muted); font-size: 12px; white-space: pre-wrap; max-height: 120px; overflow: auto; }
.card .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.empty { color: var(--dim); font-size: 13px; padding: 10px 2px; }

.tabs { display: flex; gap: 2px; margin-bottom: 12px; border-bottom: 1px solid var(--line); }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; border-radius: 0; padding: 6px 12px; color: var(--muted); }
.tabs button.active { color: var(--text); border-bottom-color: var(--accent); }

#board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(165px, 1fr); gap: 10px; align-items: start; overflow-x: auto; padding-bottom: 8px; }
.lane { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px; min-height: 120px; }
.lane h3 { margin: 0 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); display: flex; justify-content: space-between; }
.task { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 8px; margin-bottom: 6px; cursor: pointer; }
.task:hover, .task.sel { border-color: var(--accent); }
.task .k { font-family: var(--mono); font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; }
.task .n { font-size: 13px; margin: 2px 0 4px; }
.task .m { font-size: 11px; color: var(--dim); display: flex; gap: 8px; flex-wrap: wrap; }
.task.running { border-left: 3px solid var(--run); } .task.validating { border-left: 3px solid var(--info); }
.task.needs_input { border-left: 3px solid var(--warn); } .task.failed { border-left: 3px solid var(--bad); } .task.pr_open { border-left: 3px solid var(--accent); } .task.pr_checks { border-left: 3px solid var(--info); }
.spin { display: inline-block; width: 10px; height: 10px; border: 2px solid var(--line); border-top-color: var(--run); border-radius: 50%; animation: sp 1s linear infinite; vertical-align: -1px; }
@keyframes sp { to { transform: rotate(360deg); } }

.plan-phase { margin-bottom: 14px; } .plan-phase h3 { font-size: 12px; color: var(--muted); margin: 0 0 6px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.plan-phase h3 .ph-note { font-weight: 400; color: var(--dim); }
.plan-row { display: grid; grid-template-columns: 70px 1fr 110px; gap: 10px; padding: 8px; border: 1px solid var(--line); border-radius: 6px; margin-bottom: 4px; background: var(--panel); cursor: pointer; align-items: start; }
.plan-row:hover { border-color: var(--accent); }
.plan-row ul { margin: 4px 0 0 16px; padding: 0; color: var(--muted); font-size: 12px; }
.deps { font-family: var(--mono); font-size: 11px; color: var(--dim); }

.dec { display: grid; grid-template-columns: 70px 90px 1fr; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.dec .ts { color: var(--dim); font-family: var(--mono); font-size: 11px; } .dec .r { color: var(--muted); font-size: 12px; }
.actor { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.actor.human { color: var(--ok); } .actor.worker { color: var(--run); } .actor.validator { color: var(--info); } .actor.planner, .actor.orchestrator { color: var(--warn); } .actor.phase_validator { color: var(--info); }

#log { font-family: var(--mono); font-size: 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px; max-height: 48vh; overflow: auto; white-space: pre-wrap; word-break: break-word; }
.ev { padding: 2px 0; border-bottom: 1px dotted var(--line); }
.ev .role { color: var(--dim); } .ev.tool { color: var(--muted); } .ev.text { color: var(--text); } .ev.error { color: var(--bad); } .ev.state, .ev.git { color: var(--accent); } .ev.verdict { color: var(--info); font-weight: 600; } .ev.decision { color: var(--warn); } .ev.question { color: var(--warn); font-weight: 600; }
.ev .out { color: var(--dim); display: block; margin-left: 12px; max-height: 90px; overflow: auto; }
.kv { display: grid; grid-template-columns: 90px 1fr; gap: 4px 10px; font-size: 13px; margin: 8px 0; } .kv dt { color: var(--muted); } .kv dd { margin: 0; }
#detail h2 .close { margin-left: auto; cursor: pointer; }
.section { margin: 12px 0; } .section h4 { margin: 0 0 6px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
ul.acc { margin: 0; padding-left: 18px; } ul.acc li { margin: 2px 0; }
.fb { background: color-mix(in srgb, var(--bad) 10%, transparent); border: 1px solid color-mix(in srgb, var(--bad) 40%, transparent); border-radius: 6px; padding: 8px; font-size: 12px; white-space: pre-wrap; max-height: 160px; overflow: auto; }
.activity { font-family: var(--mono); font-size: 12px; } .activity .ev { padding: 4px 0; }
dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: min(420px, calc(100vw - 32px)); max-width: calc(100vw - 32px); }
dialog::backdrop { background: rgba(0,0,0,.5); }
label { display: block; font-size: 12px; color: var(--muted); margin: 8px 0 4px; }
/* agents tab: installed / signed-in state and the CLIs' own sign-in flows (T028, decision 0025) */
.acct .head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; }
.acct .head .t { margin-bottom: 0; } .acct .meta { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
.acct .notice { color: var(--warn); font-size: 12px; margin-top: 6px; overflow-wrap: anywhere; }
.acct details { margin-top: 6px; font-size: 12px; color: var(--muted); } .acct details code { overflow-wrap: anywhere; }
.acct-panel { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px; }
.acct-lines { font-family: var(--mono); font-size: 12px; max-height: 260px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; min-height: 2.4em; }
.acct-lines div { padding: 1px 0; }
.acct-send { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; } .acct-send input { flex: 1 1 200px; min-width: 0; font-family: var(--mono); }
.acct-end { font-size: 12px; margin-top: 6px; } .acct-end.bad { color: var(--bad); } .acct-end.ok { color: var(--ok); }
button.copy { margin-left: 4px; padding: 0 6px; font-size: 11px; }
/* settings tab: forms generated from the settings schema (T029, decision 0026) */
.setbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 12px; }
.setbar button.active { border-color: var(--accent); color: var(--accent); }
.setgrp { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; max-width: 760px; }
.setgrp h3 { margin: 0 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.setgrp h4 { margin: 12px 0 4px; font-size: 12px; color: var(--muted); }
.fld { margin: 8px 0; } .fld label { margin: 0 0 3px; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; }
.fld input[type=text], .fld input[type=number], .fld input[type=password], .fld select, .fld textarea { width: 100%; max-width: 520px; }
.fld textarea { min-height: 52px; }
label.chk { display: flex; gap: 8px; align-items: baseline; color: var(--text); font-size: 13px; margin: 8px 0 2px; }
.hint { color: var(--dim); font-size: 12px; margin-top: 2px; overflow-wrap: anywhere; }
.restart-badge { display: inline-block; padding: 0 7px; border-radius: 999px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--warn); border: 1px solid var(--warn); }
.restart-note { border: 1px solid var(--warn); color: var(--warn); border-radius: 6px; padding: 6px 10px; margin-bottom: 12px; font-size: 12px; max-width: 760px; }
.adapter { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; margin: 8px 0; background: var(--panel2); }
.adapter .adhead { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; margin-bottom: 4px; }
.adapter input[type=text], .adapter input[type=password], .adapter textarea { width: 100%; max-width: 520px; }
.envrow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 4px 0; } .envrow code { min-width: 120px; } .envrow input { flex: 1 1 160px; min-width: 0; }
table.roles { border-collapse: collapse; width: 100%; max-width: 720px; margin-top: 6px; } table.roles th, table.roles td { text-align: left; padding: 4px 8px 4px 0; font-size: 12px; vertical-align: middle; }
table.roles th { color: var(--muted); font-weight: 600; } table.roles select, table.roles input { width: 100%; min-width: 0; }
.setrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 10px 0 2px; }
.setmsg { font-size: 12px; margin-top: 8px; overflow-wrap: anywhere; white-space: pre-wrap; } .setmsg.bad { color: var(--bad); } .setmsg.ok { color: var(--ok); } .setmsg.warn { color: var(--warn); }
details.rawwrap { margin: 8px 0 12px; max-width: 760px; } details.rawwrap summary { cursor: pointer; color: var(--muted); font-size: 12px; }
details.rawwrap textarea { min-height: 220px; margin-top: 6px; }
/* review: diff viewer + send back (decision 0018) */
.diffsum { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; font-size: 12px; color: var(--muted); margin: 4px 0 8px; }
.n-add { color: var(--add-fg); font-family: var(--mono); font-size: 12px; } .n-del { color: var(--del-fg); font-family: var(--mono); font-size: 12px; }
details.review > summary { cursor: pointer; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; }
details.dfile { border: 1px solid var(--line); border-radius: 6px; margin-bottom: 6px; background: var(--bg); }
details.dfile > summary { cursor: pointer; display: flex; gap: 8px; align-items: baseline; padding: 6px 8px; font-family: var(--mono); font-size: 12px; }
details.dfile > summary::before { content: "\25B8"; color: var(--dim); } details.dfile[open] > summary::before { content: "\25BE"; }
details.dfile > summary::-webkit-details-marker { display: none; } details.dfile > summary { list-style: none; }
details.dfile > summary .p { flex: 1; min-width: 0; overflow-wrap: anywhere; }
details.dfile[open] > summary { border-bottom: 1px solid var(--line); }
.fst { font-family: var(--mono); font-size: 11px; font-weight: 700; width: 12px; display: inline-block; }
.fst.A { color: var(--add-fg); } .fst.D { color: var(--del-fg); } .fst.M { color: var(--accent); } .fst.T, .fst.U { color: var(--warn); }
pre.patch { margin: 0; padding: 4px 0; font-family: var(--mono); font-size: 12px; line-height: 1.45; overflow: auto; max-height: 60vh; }
pre.patch span { display: block; padding: 0 8px; white-space: pre; min-width: max-content; }
pre.patch .a { background: var(--add-bg); color: var(--add-fg); } pre.patch .d { background: var(--del-bg); color: var(--del-fg); }
pre.patch .h { color: var(--hunk-fg); } pre.patch .m { color: var(--dim); font-style: italic; }
.note { color: var(--dim); font-size: 12px; padding: 6px 8px; }
.trunc { background: color-mix(in srgb, var(--warn) 12%, transparent); border: 1px solid color-mix(in srgb, var(--warn) 45%, transparent); border-radius: 6px; padding: 6px 8px; font-size: 12px; margin-bottom: 8px; }
.sendback textarea { min-height: 72px; font-family: var(--sans); font-size: 13px; }
.toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--panel2); border: 1px solid var(--line); padding: 8px 14px; border-radius: 8px; z-index: 20; }
.toast.err { border-color: var(--bad); color: var(--bad); }
</style>
</head>
<body>
<div id="top">
  <h1>orch<span>.</span></h1>
  <div id="proj">
    <button id="projectSwitcher" aria-haspopup="true" aria-expanded="false" aria-controls="projectMenu" title="Switch project"><span class="name">Projects</span><span class="caret">▾</span></button>
    <div id="projectMenu" hidden>
      <div id="projectList"></div>
      <div class="menu-actions">
        <button id="btnAddProject" class="small">Add project…</button>
        <button id="btnArchiveProject" class="small danger" hidden>Archive this project…</button>
      </div>
    </div>
  </div>
  <div id="runInfo">
    <div id="runTitle">—</div>
    <div id="runMeta"></div>
  </div>
  <div id="usage" hidden title="Cost (where the agent CLI reports it) and agent time. n/a: no agent reported a cost"></div>
  <div id="controls">
    <select id="runSel" title="Switch run (past runs of this project)"></select>
    <button id="btnPlan">New plan…</button>
    <button id="btnApprove" class="primary">Approve plan</button>
    <button id="btnStart" class="primary">Start</button>
    <button id="btnPause">Pause</button>
    <button id="btnStop" class="danger">Stop</button>
    <div id="live" title="live connection"></div>
  </div>
</div>

    <input id="loginToken" type="password" autocomplete="current-password" style="width:100%" class="mono">

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmtTs = (ts) => ts ? new Date(ts).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" }) : "";
const LANES = [["pending", "Pending"], ["running", "Running"], ["validating", "Validating"], ["needs_input", "Needs input"], ["pr_checks", "Waiting on CI"], ["pr_open", "Review / merge"], ["failed", "Failed"], ["done", "Done"]];
const ciBadge = (s) => s ? `<span class="ci ${esc(s)}" title="PR checks">CI ${esc(s)}</span>` : "";
const EMPTY = { project: null, run: null, tasks: [], decisions: [], questions: [], phases: [], inbox: [], runs: [], config: {} };
let state = EMPTY;
let projects = [], gInbox = [];   // GET /api/projects, GET /api/inbox (all projects)
// The selected project persists per browser; storage can be missing or throw (private mode, blocked site data).
const LS_PROJECT = "orch.project";
const lsGet = (k) => { try { return localStorage.getItem(k); } catch { return null; } };
const lsSet = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch { /* not persisted */ } };
let selectedProject = lsGet(LS_PROJECT) || null;
// selectedRun: a run the owner picked in the run selector; null = the project's shown run (current, else newest).
let selected = null, selectedRun = null, lastEventId = 0, activity = [], activityRun = null;
const enc = encodeURIComponent;
let approveError = null; // last refused plan approval: { runId, message } (shown on the Plan tab)
let detailFor = null, reviewKey = null;
const diffs = {};   // task id -> { open, loading, data, error, files: Set<path> }
const drafts = {};  // task id -> unsent Send back text

async function api(method, p, body) {
  const r = await fetch(p, { method, headers: { "content-type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
  if (r.status === 401) { await login(); return api(method, p, body); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
// Auth (§16): on a 401, ask for the token once, trade it for an HttpOnly cookie, then reload state
// and reconnect the live stream. Concurrent 401s share one prompt.
let loginPending = null;
function login() {
  if (loginPending) return loginPending;
  loginPending = new Promise((resolve) => {
    const dlg = $("#loginDlg");
    $("#loginErr").textContent = ""; $("#loginToken").value = "";
    dlg.oncancel = (e) => e.preventDefault();   // the dashboard is useless without signing in
    $("#loginForm").onsubmit = async (e) => {
      e.preventDefault();
      const r = await fetch("/api/login", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ token: $("#loginToken").value }) });
      if (!r.ok) { $("#loginErr").textContent = "That token is not right."; $("#loginToken").select(); return; }
      dlg.close(); loginPending = null; resolve();
      if (sseStarted) connect();
      scheduleRefresh();
    };
    dlg.showModal(); $("#loginToken").focus();
  });
  return loginPending;
}
function toast(msg, err) { const t = document.createElement("div"); t.className = "toast" + (err ? " err" : ""); t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), err ? 6000 : 2500); }
async function act(fn) { try { await fn(); } catch (e) { toast(e.message, true); } }

// Full refresh: the project list, the global inbox and the selected project's snapshot (§15.1).
async function refresh() {
  const [ps, inbox] = await Promise.all([api("GET", "/api/projects"), api("GET", "/api/inbox")]);
  projects = ps; gInbox = inbox;
  if (!projects.some(p => p.id === selectedProject)) setProject(projects[0]?.id ?? null);
  if (selectedProject) {
    const pid = selectedProject;
    let s;
    try { s = await api("GET", `/api/projects/${enc(pid)}/state${selectedRun ? `?run=${enc(selectedRun)}` : ""}`); }
    catch (e) {
      if (!selectedRun) throw e;
      selectedRun = null; // the picked run is gone or not in this project: fall back to the shown run
      s = await api("GET", `/api/projects/${enc(pid)}/state`);
    }
    if (pid !== selectedProject) return; // switched while loading; that switch refreshes
    state = s;
  } else state = EMPTY;
  render();
  loadActivity().catch(() => {});
}
const quietRefresh = () => refresh().catch(() => {}); // timers and SSE: a down daemon is shown by the live dot

function setProject(id) {
  if (id === selectedProject) return;
  selectedProject = id; selectedRun = null; activityRun = null; state = EMPTY;
  lsSet(LS_PROJECT, id);
  closeDetail();
  if (!$("#tab-settings").hidden) { setDirty = false; loadSettings(true).catch(() => {}); } // the Project form follows the selection
}
async function switchProject(id) {
  closeMenu();
  if (id === selectedProject) return;
  setProject(id);
  await act(refresh);
}
const curProject = () => projects.find(p => p.id === selectedProject) || null;

function render() {
  const run = state.run, proj = curProject();
  renderProjects();
  $("#runTitle").textContent = !proj ? "No project yet" : run ? run.title : "No run yet";
  $("#runMeta").innerHTML = !proj ? "Add a git repository as a project to begin." : run ? `<span class="pill s-${run.status}">${run.status.replace("_", " ")}</span> &nbsp;run ${esc(run.id)} · ${state.tasks.filter(t => t.status === "done").length}/${state.tasks.length} done · base ${esc(run.base_branch)}` : proj.error ? "This project cannot be used until the problem below is fixed." : "Create a plan from a Spec Kit feature directory to begin.";
  renderUsage();
  const sel = $("#runSel");
  sel.innerHTML = state.runs.map(r => `<option value="${esc(r.id)}" ${run && r.id === run.id ? "selected" : ""}>${esc(r.title)} (${r.status})</option>`).join("");
  sel.hidden = state.runs.length < 2;
  $("#btnPlan").disabled = !proj || !!proj.error;
  $("#btnApprove").hidden = !(run && run.status === "plan_pending");
  $("#btnStart").hidden = !(run && ["ready", "paused", "stopped"].includes(run.status));
  $("#btnPause").hidden = !(run && run.status === "running");
  $("#btnStop").hidden = !(run && ["running", "paused"].includes(run.status));
  const c = state.config || {};
  $("#cfg").innerHTML = !proj ? "no project selected" : c.error ? `repo ${esc(c.repo)}<br><span style="color:var(--bad)">${esc(c.error)}</span>` : `project ${esc(proj.name)} (${esc(proj.id)})<br>repo ${esc(c.repo)}<br>base ${esc(c.baseBranch)} · parallel ${c.maxParallel} · attempts ${c.maxAttempts}${c.maxAgents ? ` · agents ${c.maxAgents} (all projects)` : ""}<br>merge ${c.pr ? "via PR" : "local"} · default ${c.mergePolicy}<br>gate ${esc(c.validationCommand || "—")} · validator ${c.validatorAgent ? "on" : "off"}${c.prFeedback ? `<br>PR loop: ${c.prFeedback.waitForChecks ? "wait for CI" : "no CI wait"} · ${c.prFeedback.maxRounds} rounds${c.prFeedback.trigger ? ` · comment <code>${esc(c.prFeedback.trigger)}</code>` : ""}` : ""}<br>ntfy ${c.ntfy ? "on" : "off"}<br>${Object.entries(c.roles || {}).map(([r, a]) => `${r} ${esc(a)}`).join(" · ")}`;
  renderInbox(); renderProjectError(); renderBoard(); renderPlan(); renderDecisions();
  if (selected) renderDetail(selected, false);
}

// ---- projects: switcher, add, archive, error state (REQ-PROJ-03; §15.3) ----
function dotOf(p) {
  if (p.error) return ["bad", "error: " + p.error];
  if (!p.run) return ["", "no runs yet"];
  const s = p.run.status;
  return [s === "running" ? "running" : ["plan_pending", "planning"].includes(s) ? "attn" : s === "done" ? "done" : "idle", "run " + s.replace("_", " ")];
}
function renderProjects() {
  const cur = curProject();
  const [dc, dt] = cur ? dotOf(cur) : ["", ""];
  const others = projects.filter(p => p !== cur).reduce((n, p) => n + p.inboxCount, 0);
  $("#projectSwitcher").innerHTML = cur
    ? `<span class="dot ${dc}" title="${esc(dt)}"></span><span class="name">${esc(cur.name)}</span>${cur.inboxCount ? `<span class="badge" title="items in this project's inbox">${cur.inboxCount}</span>` : ""}<span class="caret">▾</span>`
    : `<span class="name">No projects</span><span class="caret">▾</span>`;
  $("#projectSwitcher").title = `Switch project${others ? ` (${others} inbox item${others > 1 ? "s" : ""} in other projects)` : ""}`;
  $("#projectList").innerHTML = projects.length ? projects.map(p => {
    const [c, t] = dotOf(p);
    return `<button class="pitem ${p === cur ? "cur" : ""}" data-project="${esc(p.id)}" title="${esc(p.repo)}"><span class="dot ${c}" title="${esc(t)}"></span><span class="pn"><div>${esc(p.name)}</div><div class="meta">${p.error ? esc(p.error) : p.run ? `${esc(p.run.title)} · ${esc(p.run.status.replace("_", " "))}` : "no runs yet"}</div></span>${p.inboxCount ? `<span class="badge">${p.inboxCount}</span>` : ""}</button>`;
  }).join("") : `<div class="empty">No projects yet. Add a git repository to start.</div>`;
  $("#btnArchiveProject").hidden = !cur;
}
function renderProjectError() {
  const el = $("#projectError"), cur = curProject();
  let html = "";
  if (!cur) html = `<h3>No projects yet</h3><p>Register a git repository on the orch host. orch writes a starter <code>orch.config.json</code> there if it has none.</p><button class="primary" onclick="openAddProject()">Add project…</button>`;
  else if (cur.error) html = `<h3>${esc(cur.name)} cannot be used</h3><p class="why">${esc(cur.error)}</p><p>Fix the repository path or the project's <code>orch.config.json</code>; this view updates by itself. Other projects keep running.</p>`;
  el.hidden = !html; el.className = cur ? "" : "plain"; el.innerHTML = html;
  $("#board").hidden = !!html;
}
function closeMenu() { $("#projectMenu").hidden = true; $("#projectSwitcher").setAttribute("aria-expanded", "false"); }
$("#projectSwitcher").onclick = (e) => { e.stopPropagation(); const m = $("#projectMenu"); m.hidden = !m.hidden; $("#projectSwitcher").setAttribute("aria-expanded", String(!m.hidden)); };
$("#projectMenu").onclick = (e) => { e.stopPropagation(); const b = e.target.closest(".pitem"); if (b) switchProject(b.dataset.project); };
document.addEventListener("click", closeMenu);
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeMenu(); });
function openAddProject() {
  closeMenu();
  $("#apPath").value = ""; $("#apName").value = ""; $("#addProjectErr").textContent = "";
  $("#addProjectDlg").showModal(); $("#apPath").focus();
}
$("#btnAddProject").onclick = openAddProject;
$("#apCancel").onclick = () => $("#addProjectDlg").close();
$("#addProjectForm").onsubmit = async (e) => {
  e.preventDefault();
  const path = $("#apPath").value.trim(), name = $("#apName").value.trim();
  if (!path) { $("#addProjectErr").textContent = "Enter the path of a git repository."; return; }
  $("#apGo").disabled = true; $("#addProjectErr").textContent = "";
  try {
    const p = await api("POST", "/api/projects", name ? { path, name } : { path });
    $("#addProjectDlg").close();
    toast(p.unarchived ? `restored archived project ${p.name}` : p.configCreated ? `added ${p.name}; starter settings written to ${p.configCreated}` : `added ${p.name}`);
    setProject(p.id); await act(refresh);
  } catch (err) { $("#addProjectErr").textContent = err.message; } // registry message, e.g. not a git repository
  finally { $("#apGo").disabled = false; }
};
$("#btnArchiveProject").onclick = () => act(async () => {
  const cur = curProject(); if (!cur) return;
  closeMenu();
  if (!confirm(`Archive project "${cur.name}"?\n\nIt leaves the project list and the inbox. Its runs, decisions and repository are kept, and Add project with the same path restores it.`)) return;
  await api("DELETE", `/api/projects/${enc(cur.id)}`); // 400 names an unfinished run
  toast(`archived ${cur.name}`);
  setProject(null); await refresh();
});

// ---- global inbox (REQ-HITL-01): every project's items, tagged; clicking one switches to its project ----
function inboxBody(i) {
  const tag = `<span class="ptag" title="project ${esc(i.project_id)}">${esc(i.project_name)}</span>`;
  const pid = `this.closest('[data-project]').dataset.project`;
  if (i.type === "approve_plan") return `<div class="t">${tag}Plan awaits your approval</div><div class="d">${esc(i.detail)}. Review the Plan tab, edit tasks if needed, then approve.</div><div class="actions"><button class="primary small" onclick="approvePlan('${esc(i.run_id)}')">Approve plan</button></div>`;
  if (i.type === "question") return `<div class="t">${tag}${i.task_key ? `<span class="mono">${esc(i.task_key)}</span> asks` : `<span class="pill s-plan_pending" title="About the whole plan: no task starts until it is answered">Plan</span> question · tasks wait for your answer`}</div><div class="d">${esc(i.title)}</div><div class="actions">${(i.options || []).map(o => `<button class="small" onclick="answer(${i.id}, ${esc(JSON.stringify(o))})">${esc(o)}</button>`).join("")}</div><div class="actions"><input placeholder="or type an answer…" style="flex:1" id="qa-${i.id}" onkeydown="if(event.key==='Enter')answer(${i.id}, this.value)"><button class="small" onclick="answer(${i.id}, document.getElementById('qa-${i.id}').value)">Send</button></div>`;
  if (i.type === "failed") return `<div class="t">${tag}<span class="pill s-failed">failed</span> ${esc(i.task_key)}</div><div class="d">${esc((i.detail || "").slice(0, 400))}</div><div class="actions"><button class="small" onclick="goTask(${pid}, '${esc(i.task_id)}')">Inspect</button><button class="small good" onclick="taskAct('${esc(i.task_id)}','retry')">Retry</button><button class="small" onclick="taskAct('${esc(i.task_id)}','skip')">Skip</button></div>`;
  if (i.type === "merge") return `<div class="t">${tag}<span class="pill s-pr_open">review</span> ${esc(i.task_key)} ${ciBadge(i.ci_status)}${i.fix_rounds ? ` <span class="ci">· ${i.fix_rounds} fix round${i.fix_rounds > 1 ? "s" : ""}</span>` : ""}</div><div class="d">${i.pr_url ? `<a href="${esc(i.pr_url)}" target="_blank">${esc(i.pr_url)}</a>` : esc(i.detail)}${i.feedback ? "\n" + esc(i.feedback.slice(0, 300)) : ""}</div><div class="actions"><button class="small" onclick="goTask(${pid}, '${esc(i.task_id)}')">Inspect</button><button class="small good" onclick="taskAct('${esc(i.task_id)}','merge')">Merge now</button><button class="small" onclick="openSendBack('${esc(i.task_id)}', ${pid})">Send back…</button><button class="small" onclick="taskAct('${esc(i.task_id)}','mark-merged')">Merged elsewhere</button><button class="small" onclick="taskAct('${esc(i.task_id)}','retry')">Re-run</button></div>`;
  if (i.type === "phase") return `<div class="t">${tag}<span class="pill s-needs_human">phase</span> ${esc(phaseLabel(i.phase_name))}${i.fixup_rounds ? ` <span class="ci">· ${i.fixup_rounds} fix-up round${i.fixup_rounds > 1 ? "s" : ""}</span>` : ""}</div><div class="d">Phase validation failed; later phases wait.${i.detail ? "<br>" + esc(i.detail.slice(0, 400)) : ""}</div><div class="actions"><button class="small good" onclick="phaseAct(${i.phase_id},'revalidate')" title="Validate the phase again on the base branch (e.g. after fixing it by hand)">Re-run validation</button><button class="small" onclick="phaseAct(${i.phase_id},'accept')" title="Accept the phase as it is; later phases start">Accept phase</button></div>`;
  if (i.type === "docs_update") {
    // REQ-HITL-08: the four lists; Copy gives the plain text /orch-spec fold-back reads.
    docsTexts[i.run_id] = i.text;
    const u = i.update || {};
    const list = (h, items) => `<b>${h}</b>${items.length ? items.map(x => "\n• " + esc(x)).join("") : "\nnone"}`;
    const body = [
      list("REQ IDs", (u.reqs || []).map(r => `${r.id} (${r.tasks.join(", ")}${r.notMerged.length ? `; not merged: ${r.notMerged.map(n => n.task + " " + n.status).join(", ")}` : ""})`)),
      list("Decisions", (u.decisions || []).map(d => `${d.actor}${d.task ? " " + d.task : ""}: ${d.text}`)),
      list("Plan edits", (u.planEdits || []).map(e => `${e.task || "plan"}: ${e.detail || e.text}`)),
      list("Contracts", (u.contracts || []).map(c => `${c.name} (${c.tasks.join(", ")})`)),
    ].join("\n");
    return `<div class="t">${tag}<span class="pill s-done">docs</span> Update project docs</div><div class="d">${esc(i.title.replace(/^Update project docs: /, ""))} · ${esc(u.feature || "")}\n${body}</div><div class="actions"><button class="small primary" onclick="copyDocsUpdate('${esc(i.run_id)}')" title="Copy the plain text; paste it into /orch-spec fold-back">Copy</button><button class="small" onclick="ackDocsUpdate('${esc(i.run_id)}')" title="Remove this item from the inbox (after folding it back into the project docs)">Acknowledge</button></div>`;
  }
  return "";
}
const docsTexts = {};   // run id → the docs update's plain text (Copy)
async function copyDocsUpdate(runId) {
  const text = docsTexts[runId] || "";
  try { await navigator.clipboard.writeText(text); }
  catch {
    // No clipboard API (plain http on another host): copy through a selected textarea.
    const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } finally { ta.remove(); }
  }
  toast("copied: paste it into /orch-spec fold-back");
}
async function ackDocsUpdate(runId) { await act(async () => { await api("POST", `/api/runs/${runId}/docs-update/ack`); toast("acknowledged"); await refresh(); }); }
function renderInbox() {
  const list = $("#globalInbox"), n = gInbox.length;
  $("#inboxCount").hidden = !n; $("#inboxCount").textContent = n;
  if (!n) { list.innerHTML = `<div class="empty">Nothing needs you right now${projects.length > 1 ? " in any project" : ""}.</div>`; return; }
  // Keep a half-typed answer across re-renders.
  const typed = {}; list.querySelectorAll("input[id^='qa-']").forEach(el => { if (el.value) typed[el.id] = el.value; });
  const focused = document.activeElement && list.contains(document.activeElement) ? document.activeElement.id : null;
  list.innerHTML = gInbox.map(i => { const body = inboxBody(i); return body ? `<div class="card hot inb ${i.project_id === selectedProject ? "here" : ""}" data-project="${esc(i.project_id)}" ${i.task_id ? `data-task="${esc(i.task_id)}"` : ""} title="${esc(i.project_name)}: click to open">${body}</div>` : ""; }).join("");
  for (const [id, v] of Object.entries(typed)) { const el = document.getElementById(id); if (el) el.value = v; }
  if (focused) document.getElementById(focused)?.focus();
}
$("#globalInbox").onclick = (e) => {
  if (e.target.closest("button, input, a, textarea, select")) return; // the item's own actions
  const card = e.target.closest(".card.inb"); if (!card) return;

/** Approve a plan; a refusal (e.g. a dependency cycle, §6.3) is toasted and kept on the Plan tab until the next attempt. */
async function approvePlan(runId) {
  try {
    await api("POST", `/api/runs/${encodeURIComponent(runId)}/approve`);
    approveError = null; toast("approved — press Start");
  } catch (e) {
    approveError = { runId, message: e.message }; toast(e.message, true);
  }
  await refresh();
}
$("#btnStart").onclick = () => act(async () => { await api("POST", `/api/runs/${state.run.id}/start`); await refresh(); });

$("#runSel").onchange = (e) => { selectedRun = e.target.value; closeDetail(); act(refresh); };
function closeDetail() {

$("#closeDetail").onclick = () => { closeDetail(); renderBoard(); };
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => { document.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("active", x === b)); for (const t of ["board", "plan", "decisions", "activity", "agents", "settings"]) $(`#tab-${t}`).hidden = t !== b.dataset.tab; if (b.dataset.tab === "agents") act(loadAccounts); if (b.dataset.tab === "settings") act(() => loadSettings(true)); });

// Agents tab (T028, decision 0025): one card per configured CLI plus gh, rendered from GET /api/accounts so a new
// adapter needs no change here. Sign in streams the CLI's own login flow; nothing from a flow is stored or kept
// beyond this page's memory.
let accounts = null;          // rows from GET /api/accounts; null = not loaded yet
const flows = {};             // account id -> { lines: [string], active, exit, hint, cancelled, timedOut, draft }
const acctErr = {};           // account id -> last refused sign-in (e.g. 501 with the command to run by hand)
const acctBusy = () => (accounts || []).some(r => flows[r.id] && flows[r.id].active);
const acctById = (id) => [...document.querySelectorAll("#tab-agents .acct")].find(e => e.dataset.id === id);
const STATUS_LABEL = { signed_in: ["signed in", "s-done"], signed_out: ["signed out", "s-needs_human"], unknown: ["unknown", "s-pending"] };

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); }
  catch {
    // No clipboard API (plain http on another host): copy through a selected textarea.
    const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } finally { ta.remove(); }
  }
  toast("copied");
}
// One output line as HTML: https:// tokens become links; on a line that mentions a code, a code-shaped token gets a Copy button.
function acctLineHtml(line) {
  const mentionsCode = /code/i.test(line);
  return line.split(/(\s+)/).map((tok) => {
    if (!tok.trim()) return esc(tok);
    const m = tok.match(/^([("'\[]*)(.*?)([)"'\].,;:!?]*)$/);
    const pre = m[1], core = m[2], post = m[3];
    if (/^https:\/\/\S+$/i.test(core)) return `${esc(pre)}<a href="${esc(core)}" target="_blank" rel="noopener noreferrer">${esc(core)}</a>${esc(post)}`;
    const codeLike = /^[A-Z0-9]{4}-[A-Z0-9]{4}$/.test(core) || (/^[A-Za-z0-9_-]{8,}$/.test(core) && /[0-9_-]/.test(core));
    if (mentionsCode && codeLike) return `${esc(pre)}<b class="mono">${esc(core)}</b><button type="button" class="copy small" data-copy="${esc(core)}" title="copy this code">copy</button>${esc(post)}`;
    return esc(tok);
  }).join("");
}
function acctPanelHtml(r) {
  const f = flows[r.id];
  if (!f) return "";
  const end = f.active ? "" : `<div class="acct-end ${f.exit === 0 ? "ok" : "bad"}">${f.cancelled ? "Cancelled." : f.timedOut ? "Stopped after 10 minutes." : f.exit === 0 ? "Finished." : `Ended with exit code ${esc(f.exit ?? "none")}.`}${f.hint ? " " + esc(f.hint) : ""}</div>`;
  return `<div class="acct-panel">
    <div class="acct-lines" aria-live="polite">${f.lines.map(l => `<div>${acctLineHtml(l)}</div>`).join("") || `<div class="meta">Waiting for the CLI to print…</div>`}</div>
    ${f.active ? `<form class="acct-send" data-id="${esc(r.id)}"><input name="text" autocomplete="off" spellcheck="false" placeholder="Type what the CLI asks for, then Send (empty sends Enter)" value="${esc(f.draft || "")}"><button class="primary" type="submit">Send</button><button type="button" class="danger" data-act="cancel">Cancel</button></form>` : `<button type="button" class="small" data-act="close" style="margin-top:6px">Close</button>`}
    ${end}</div>`;
}
function acctCardHtml(r) {
  const [label, cls] = STATUS_LABEL[r.status] || STATUS_LABEL.unknown;
  const f = flows[r.id], active = !!(f && f.active) || r.loginActive;
  const installed = r.version !== null || !String(r.detail).startsWith("not installed");
  const btn = !r.canLogin ? "" : `<button type="button" class="${r.status === "signed_in" ? "" : "primary"}" data-act="login" ${active || !installed ? "disabled" : ""}>${r.status === "signed_in" ? "Sign in again" : "Sign in"}</button>`;
  return `<div class="card acct" data-id="${esc(r.id)}">
    <div class="head"><span class="t">${esc(r.id)}</span><span class="pill ${cls}">${label}</span>
      <span class="meta mono">${esc(r.type)} · ${esc(r.command)}${r.version ? " · " + esc(r.version) : ""}</span><span style="margin-left:auto">${btn}</span></div>
    <div class="meta">${esc(r.detail)}</div>
    ${!r.canLogin && r.loginNotice ? `<div class="notice">${esc(r.loginNotice)}</div>` : ""}
    ${acctErr[r.id] ? `<div class="err">${esc(acctErr[r.id])}</div>` : ""}
    ${acctPanelHtml(r)}
    ${r.manualCommand ? `<details><summary>Or sign in by hand</summary>Run <code>${esc(r.manualCommand)}</code> on the server (in Docker: <code>docker compose run --rm orch ${esc(r.manualCommand)}</code>).</details>` : ""}
  </div>`;
}
function renderAccounts() {
  const el = $("#tab-agents");
  if (!accounts) { el.innerHTML = `<div class="empty">Checking the installed CLIs…</div>`; return; }
  el.innerHTML = `<div style="display:flex;gap:8px;align-items:center;margin-bottom:8px"><span class="meta" style="color:var(--muted);font-size:12px">Agent CLIs and the GitHub CLI on the orch server. Sign in runs each CLI's own login there; orch stores no credentials.</span><button type="button" class="small" data-act="refresh" style="margin-left:auto">Refresh</button></div>${accounts.map(acctCardHtml).join("")}`;
  const lines = el.querySelectorAll(".acct-lines"); lines.forEach(l => { l.scrollTop = l.scrollHeight; });
}
async function loadAccounts() {
  if (acctBusy() && accounts) return; // never re-render under a flow the owner is typing into
  const first = !accounts;
  if (first) renderAccounts();
  accounts = await api("GET", "/api/accounts");
  // A flow started before this page was opened (or before a reload): fetch what it printed so far.
  for (const r of accounts) if (r.loginActive && !(flows[r.id] && flows[r.id].active)) {
    const j = await api("GET", `/api/accounts/${enc(r.id)}/login`).catch(() => null);
    if (j && j.active) flows[r.id] = { lines: j.lines, active: true };
  }
  renderAccounts();
}
function onAccountEvent(ev) {
  const id = ev.id;
  if (ev.line !== undefined) {
    const f = flows[id] || (flows[id] = { lines: [], active: true });
    f.lines.push(ev.line); if (f.lines.length > 300) f.lines.shift();
    const box = acctById(id)?.querySelector(".acct-lines");
    if (box) {
      if (f.lines.length === 1) box.innerHTML = "";
      box.insertAdjacentHTML("beforeend", `<div>${acctLineHtml(ev.line)}</div>`); box.scrollTop = box.scrollHeight;
    } else if (accounts && $("#tab-agents").hidden === false) renderAccounts();
  } else if (ev.done) {
    const f = flows[id] || (flows[id] = { lines: [], active: true });
    Object.assign(f, { active: false, exit: ev.exitCode, hint: ev.hint, cancelled: !!ev.cancelled, timedOut: !!ev.timedOut });
    if (accounts && $("#tab-agents").hidden === false) renderAccounts();
  } else if (ev.account && accounts) {
    const i = accounts.findIndex(r => r.id === ev.account.id);
    if (i >= 0) accounts[i] = ev.account; else accounts.push(ev.account);
    if ($("#tab-agents").hidden === false) renderAccounts();
  }
}
$("#tab-agents").addEventListener("click", async (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.copy) return copyText(b.dataset.copy);
  const card = b.closest(".acct"), id = card && card.dataset.id, a = b.dataset.act;
  if (a === "refresh") return act(async () => { accounts = null; await loadAccounts(); });
  if (!id) return;
  if (a === "login") {
    delete acctErr[id]; flows[id] = { lines: [], active: true };
    try { await api("POST", `/api/accounts/${enc(id)}/login`); }
    catch (err) { delete flows[id]; acctErr[id] = err.message; }
    renderAccounts();
  } else if (a === "cancel") {
    await act(() => api("POST", `/api/accounts/${enc(id)}/login/cancel`));
  } else if (a === "close") {
    delete flows[id]; renderAccounts();
  }
});
$("#tab-agents").addEventListener("input", (e) => {
  const form = e.target.closest(".acct-send"); if (form && flows[form.dataset.id]) flows[form.dataset.id].draft = e.target.value;
});
$("#tab-agents").addEventListener("submit", async (e) => {
  e.preventDefault();
  const form = e.target.closest(".acct-send"); if (!form) return;
  const id = form.dataset.id, input = form.elements.text, text = input.value;
  input.value = ""; if (flows[id]) flows[id].draft = "";
  await act(() => api("POST", `/api/accounts/${enc(id)}/login/input`, { text }));
  input.focus();
});

// Settings tab (T029, decision 0026): a Server form and a Project form generated from GET /api/settings/schema, so a new
// setting needs no change here. Saving PUTs only what changed; the server validates with the same loaders as startup.
// Secrets are write-only: the API sends {set}, the page shows "set" and sends a value only when the owner types one.
// <settings-forms>
const SET_TYPES = ["string", "int", "bool", "enum", "list", "map"];
const ROLES = ["planner", "worker", "validator", "phaseValidator"];
const hasPlaceholder = (k) => /[<*]/.test(k);
const dotGet = (o, p) => p.split(".").reduce((n, s) => (n !== null && typeof n === "object" ? n[s] : undefined), o);
const listText = (v) => (Array.isArray(v) ? v.join("\n") : "");
const envText = (v) => Object.entries(v && typeof v === "object" ? v : {}).map(([k, x]) => `${k}=${x}`).join("\n");
const isEnvMap = (e) => e.type === "map" && e.key.endsWith(".env");

/** The text a field starts with. Saving compares it with what the field holds now, so unchanged fields are never sent. */
function fieldText(e, value) {
  if (e.secret) return "";
  if (e.type === "bool") return String(!!value);
  if (e.type === "list") return listText(value);
  if (isEnvMap(e)) return envText(value);
  if (e.type === "map") return JSON.stringify(value ?? {}, null, 2);
  return value === undefined || value === null ? "" : String(value);
}

/** One schema entry as a form field. `o.readOnly` disables it; `o.pending` lists the keys waiting for a restart. */
function fieldHtml(e, value, o = {}) {
  const dataType = e.type === "map" && !isEnvMap(e) ? "json" : e.type;
  const attrs = `data-key="${esc(e.key)}" data-type="${esc(dataType)}" data-init="${esc(fieldText(e, value))}"${o.readOnly ? " disabled" : ""}`;
  const badge = (o.pending || []).includes(e.key) ? ` <span class="restart-badge" data-restart="${esc(e.key)}">restart required</span>` : "";
  const hint = `<div class="hint">${esc(e.description)}${e.restart && !o.readOnly ? " Takes effect after a restart." : ""}</div>`;
  const name = `<code>${esc(e.key)}</code>`;
  if (e.type === "bool") return `<div class="fld"><label class="chk"><input type="checkbox" ${attrs}${value ? " checked" : ""}> <span>${name}</span>${badge}</label>${hint}</div>`;
  let input;
  if (e.secret) {
    const set = !!(value && value.set === true);
    input = `<input type="password" ${attrs} autocomplete="new-password" placeholder="${o.readOnly ? (set ? "set" : "not set") : (set ? "set (leave empty to keep)" : "not set")}">`;
  } else if (e.type === "int") {
    input = `<input type="number" step="1" ${attrs} value="${esc(fieldText(e, value))}"${e.min !== undefined ? ` min="${e.min}"` : ""}${e.max !== undefined ? ` max="${e.max}"` : ""}>`;
  } else if (e.type === "enum") {
    input = `<select ${attrs}>${(e.enum || []).map(v => `<option value="${esc(v)}"${v === value ? " selected" : ""}>${esc(v)}</option>`).join("")}</select>`;
  } else if (e.type === "list" || e.type === "map") {
    input = `<textarea ${attrs} rows="${e.type === "list" ? 2 : 4}" spellcheck="false">${esc(fieldText(e, value))}</textarea>`;
  } else {
    input = `<input type="text" ${attrs} value="${esc(fieldText(e, value))}">`;
  }
  const note = isEnvMap(e) ? `<div class="hint">One NAME=value per line.</div>` : e.type === "list" ? `<div class="hint">One per line.</div>` : "";
  return `<div class="fld"><label>${name}${badge}</label>${input}${note}${hint}</div>`;
}

/** Plain-key entries of one scope that the page can draw as a field, and the ones whose type it does not know. */
function formEntries(schema, scope) {
  const plain = schema.filter(e => e.scope === scope && !hasPlaceholder(e.key));
  return { fields: plain.filter(e => SET_TYPES.includes(e.type)), unknown: plain.filter(e => !SET_TYPES.includes(e.type)) };
}
const groupOrder = (entries) => [...new Set(entries.map(e => e.group))];

function adapterOptions(names, selected, blank) {
  return (blank !== undefined ? [`<option value=""${selected ? "" : " selected"}>${esc(blank)}</option>`] : [])
    .concat(names.map(n => `<option value="${esc(n)}"${n === selected ? " selected" : ""}>${esc(n)}</option>`)).join("");
}
function envRowNewHtml() {
  return `<div class="envrow new"><input type="text" data-envkey placeholder="NAME" autocomplete="off"><input type="password" data-envval placeholder="value" autocomplete="new-password"></div>`;
}
function adapterHtml(name, a) {
  const env = a.env && typeof a.env === "object" ? a.env : {};
  const init = (v) => `data-init="${esc(v)}"`;
  const rows = Object.entries(env).map(([k, v]) => `<div class="envrow" data-env="${esc(k)}"><code>${esc(k)}</code><input type="password" data-envval autocomplete="new-password" placeholder="${v && v.set ? "set (leave empty to keep)" : "not set"}"><button type="button" class="small danger" data-act="env-del">Remove</button></div>`).join("");
  return `<div class="adapter" data-adapter="${esc(name)}" data-envkeys="${esc(JSON.stringify(Object.keys(env)))}">
    <div class="adhead"><b>${esc(name)}</b><span class="hint">adapter</span></div>
    <label>type</label><input type="text" data-ad="type" ${init(a.type ?? "")} value="${esc(a.type ?? "")}">
    <label>command</label><input type="text" data-ad="command" ${init(a.command ?? "")} value="${esc(a.command ?? "")}">
    <label>extra arguments (one per line)</label><textarea data-ad="extraArgs" rows="2" spellcheck="false" ${init(listText(a.extraArgs))}>${esc(listText(a.extraArgs))}</textarea>
    <label>environment variables (values are write-only)</label>
    <div class="envrows">${rows}${envRowNewHtml()}</div>
    <button type="button" class="small" data-act="env-add">Add variable</button>
  </div>`;
}

/** Roles: the server default (editable here) beside the selected project's override (read-only; changed in the Project form). */
function rolesTableHtml(S, ctx) {
  const names = Object.keys((S.agents && S.agents.adapters) || {});
  const over = (ctx.projectSettings && ctx.projectSettings.settings && ctx.projectSettings.settings.roles) || {};
  const pname = ctx.project ? (ctx.project.name || ctx.project.id) : null;
  const rows = ROLES.map(r => {
    const d = (S.agents && S.agents.roles && S.agents.roles[r]) || {};
    const o = over[r] || {};
    const k = (f) => `agents.roles.${r}.${f}`;
    const adapterCell = `<select data-key="${k("adapter")}" data-type="enum" data-init="${esc(d.adapter ?? "")}">${adapterOptions(names, d.adapter, r === "phaseValidator" ? "(same as validator)" : undefined)}</select>`;
    const modelCell = `<input type="text" data-key="${k("model")}" data-type="string" data-init="${esc(d.model ?? "")}" value="${esc(d.model ?? "")}" placeholder="CLI default">`;
    const projCell = pname ? `<select disabled>${adapterOptions(names, o.adapter, "(server default)")}</select> <input type="text" disabled value="${esc(o.model ?? "")}" placeholder="server default">` : `<span class="hint">no project</span>`;
    return `<tr data-role="${r}"><td><code>${r}</code></td><td>${adapterCell}</td><td>${modelCell}</td><td>${projCell}</td></tr>`;
  }).join("");
  return `<h4>Roles</h4><div class="hint">Which adapter and model each role uses by default. Different adapters for the worker and the validator give independent judgement. A project can override a role in the Project form${pname ? ` (the column on the right shows <b>${esc(pname)}</b>)` : ""}. Sign-in status of each CLI is on the Agents tab.</div>
  <table class="roles"><tr><th>Role</th><th>Server default adapter</th><th>Model</th><th>${pname ? `Override in ${esc(pname)}` : "Project override"}</th></tr>${rows}</table>`;
}

function serverFormHtml(schema, view, ctx = {}) {
  const S = view.settings, pending = view.restartRequired || [];
  const { fields } = formEntries(schema, "server");
  const by = (g) => fields.filter(e => e.group === g);
  const draw = (list, readOnly) => list.map(e => fieldHtml(e, dotGet(S, e.key), { readOnly, pending })).join("");
  const adapters = Object.entries((S.agents && S.agents.adapters) || {}).map(([n, a]) => adapterHtml(n, a)).join("");
  const defaultsEntry = schema.find(e => e.scope === "server" && e.key === "defaults.*");
  const banner = pending.length ? `<div class="restart-note">Saved, but the running daemon still uses the old value of <code>${pending.map(esc).join("</code>, <code>")}</code>. Restart orch to apply ${pending.length === 1 ? "it" : "them"}.</div>` : "";
  return `${banner}
  <section class="setgrp"><h3>Agents</h3>${draw(by("Agents"), false)}<h4>Adapters</h4><div class="hint">Named agent CLIs. A project's roles pick one by name. Environment values are write-only.</div>${adapters}${rolesTableHtml(S, ctx)}</section>
  <section class="setgrp"><h3>Notifications</h3>${draw(by("Notifications"), false)}<div class="setrow"><button type="button" data-act="notify-test">Send test</button><span id="notifyResult" class="setmsg"></span></div><div class="hint">Send test uses the saved settings: save first.</div></section>
  <section class="setgrp"><h3>Server</h3><div class="hint">Read-only here: edit server.json and restart. Changing the address, port or token from the page that depends on them could lock you out.</div>${draw(by("Server"), true)}</section>
  ${defaultsEntry ? `<details class="rawwrap"><summary>Advanced: defaults for every project</summary>${fieldHtml(defaultsEntry, dotGet(S, "defaults"), { pending })}</details>` : ""}
  <div class="setrow"><button class="primary" type="button" data-act="save-server">Save server settings</button></div><div id="serverMsg" class="setmsg"></div>`;
}

function projectRolesHtml(S, view) {
  const names = Object.keys((S && S.agents && S.agents.adapters) || {});
  const over = (view.settings && view.settings.roles) || {};
  const eff = (view.effective && view.effective.roles) || {};
  const rows = ROLES.map(r => {
    const o = over[r] || {}, e = eff[r] || {};
    return `<tr data-role="${r}"><td><code>${r}</code></td>
      <td><select data-key="roles.${r}.adapter" data-type="enum" data-init="${esc(o.adapter ?? "")}">${adapterOptions(names, o.adapter, `(server default${e.adapter ? ": " + e.adapter : ""})`)}</select></td>
      <td><input type="text" data-key="roles.${r}.model" data-type="string" data-init="${esc(o.model ?? "")}" value="${esc(o.model ?? "")}" placeholder="${esc(e.model || "CLI default")}"></td></tr>`;
  }).join("");
  return `<div class="hint">An empty adapter uses the server default (Server form). Adapters are defined in server.json.</div><table class="roles"><tr><th>Role</th><th>Adapter</th><th>Model</th></tr>${rows}</table>`;
}

function projectFormHtml(schema, view, ctx = {}) {
  const raw = view.invalidText !== undefined ? view.invalidText : JSON.stringify(view.settings || {}, null, 2);
  const rawEditor = `<details class="rawwrap"${view.effective ? "" : " open"}><summary>Raw JSON (orch.config.json)</summary><textarea id="projectRaw" spellcheck="false">${esc(raw)}</textarea>
    <div class="setrow"><button type="button" data-act="save-raw">Save raw JSON</button><span class="hint">Replaces the whole file; validated by the same rules.</span></div></details>`;
  const problem = view.error ? `<div class="setmsg bad">${esc(view.error)}</div>` : "";
  if (!view.effective) return `${problem}${rawEditor}<div id="projectMsg" class="setmsg"></div>`;
  const { fields, unknown } = formEntries(schema, "project");
  const eff = view.effective;
  const draw = (list) => list.map(e => fieldHtml(e, dotGet(eff, e.key))).join("");
  const normal = fields.filter(e => !e.advanced), adv = fields.filter(e => e.advanced);
  const groups = groupOrder(normal).map(g => `<section class="setgrp"><h3>${esc(g)}</h3>${draw(normal.filter(e => e.group === g))}</section>`).join("");
  const advanced = groupOrder(adv).map(g => `<section class="setgrp"><h3>${esc(g)} (advanced)</h3>${draw(adv.filter(e => e.group === g))}</section>`).join("");
  const warnings = (view.warnings || []).length ? `<div class="setmsg warn">${view.warnings.map(esc).join("<br>")}</div>` : "";
  const skipped = unknown.length ? `<div class="hint">Not editable as a field, use the raw JSON: ${unknown.map(e => `<code>${esc(e.key)}</code> (${esc(e.type)})`).join(", ")}</div>` : "";
  return `${problem}${warnings}${groups}
  <section class="setgrp"><h3>Roles</h3>${projectRolesHtml(ctx.serverSettings && ctx.serverSettings.settings, view)}</section>
  <div class="setrow"><button type="button" class="small" data-act="toggle-advanced">Advanced settings</button><span class="hint">Hand-off budgets and the pull request feedback loop.</span></div>
  <div class="advanced" hidden>${advanced}</div>
  ${skipped}${rawEditor}
  <div class="setrow"><button class="primary" type="button" data-act="save-project">Save project settings</button></div>
  <div class="hint">Saving writes <code>orch.config.json</code> in the repository and commits it to the base branch when that checkout has no other changes.</div><div id="projectMsg" class="setmsg"></div>`;
}
// </settings-forms>

let setView = { schema: null, server: null, project: null, pid: null };
let setSub = "server", setDirty = false;
const setRoot = () => $("#tab-settings");

async function loadSettings(force) {
  if (setDirty && !force) return; // never replace a form the owner is typing into
  const pid = selectedProject;
  const [schema, server, project] = await Promise.all([
    setView.schema || api("GET", "/api/settings/schema"),
    api("GET", "/api/settings/server"),
    pid ? api("GET", `/api/projects/${enc(pid)}/settings`) : Promise.resolve(null),
  ]);
  setView = { schema, server, project, pid };
  setDirty = false;
  renderSettings();
}
function renderSettings() {
  const el = setRoot(), { schema, server, project, pid } = setView;
  if (!schema) { el.innerHTML = `<div class="empty">Loading settings…</div>`; return; }
  const p = pid ? projects.find(x => x.id === pid) : null;
  const pname = p ? p.name || p.id : null;
  el.innerHTML = `<div class="setbar"><button type="button" data-sub="server" class="${setSub === "server" ? "active" : ""}">Server</button>
    <button type="button" data-sub="project" class="${setSub === "project" ? "active" : ""}"${pid ? "" : " disabled"}>Project${pname ? `: ${esc(pname)}` : ""}</button>
    <span class="hint">Server settings are <code>server.json</code>; project settings are <code>orch.config.json</code> in the repository.</span></div>
    <div id="setServer"${setSub === "server" ? "" : " hidden"}>${serverFormHtml(schema, server, { project: p, projectSettings: project })}</div>
    <div id="setProject"${setSub === "project" ? "" : " hidden"}>${project ? projectFormHtml(schema, project, { serverSettings: server }) : `<div class="empty">No project selected.</div>`}</div>`;
}

// Field values -> a PUT patch holding only what changed.
function setPath(obj, key, v) {
  const segs = key.split(".");
  let n = obj;
  for (const s of segs.slice(0, -1)) n = (n[s] = n[s] || {});
  n[segs[segs.length - 1]] = v;
}
function fieldValue(el) {
  switch (el.dataset.type) {
    case "bool": return el.checked;
    case "int": return el.value.trim() === "" ? undefined : Number(el.value);
    case "list": return el.value.split("\n").map(s => s.trim()).filter(Boolean);
    case "map": return Object.fromEntries(el.value.split("\n").map(l => l.trim()).filter(Boolean).map(l => { const i = l.indexOf("="); return i < 0 ? [l, ""] : [l.slice(0, i).trim(), l.slice(i + 1)]; }));
    case "json": { const t = el.value.trim(); return t ? JSON.parse(t) : {}; }
    default: return el.value;
  }
}
const fieldChanged = (el) => el.dataset.type === "bool" ? String(el.checked) !== el.dataset.init : el.type === "password" ? el.value !== "" : el.value !== el.dataset.init;

/** The changed `data-key` fields of a form as a nested patch. `scope` decides how an emptied role override is sent. */
function collectPatch(root, scope) {
  const patch = {};
  const roleSiblings = new Set();
  for (const el of root.querySelectorAll("[data-key]")) {
    if (el.disabled || !fieldChanged(el)) continue;
    const key = el.dataset.key;
    let v = fieldValue(el);
    if (v === undefined) continue;
    if (scope === "project" && /^roles\.\w+\.adapter$/.test(key) && v === "") v = null; // no override: use the server default
    setPath(patch, key, v);
    const m = key.match(/^agents\.roles\.(\w+)\./);
    if (m) roleSiblings.add(m[1]);
  }
  // A server role is always sent whole (adapter and model), so a half-written role never lands in the file.
  for (const r of roleSiblings) for (const f of ["adapter", "model"]) {
    const el = root.querySelector(`[data-key="agents.roles.${r}.${f}"]`);
    if (el) setPath(patch, `agents.roles.${r}.${f}`, el.value);
  }
  return patch;
}
function collectAdapters(root, patch) {
  for (const card of root.querySelectorAll(".adapter[data-adapter]")) {
    const name = card.dataset.adapter, base = `agents.adapters.${name}`;
    for (const el of card.querySelectorAll("[data-ad]")) {
      if (el.value === el.dataset.init) continue;
      setPath(patch, `${base}.${el.dataset.ad}`, el.dataset.ad === "extraArgs" ? el.value.split("\n").map(s => s.trim()).filter(Boolean) : el.value);
    }
    const before = JSON.parse(card.dataset.envkeys || "[]"), env = {};
    let changed = false;
    const present = [];
    for (const row of card.querySelectorAll(".envrow")) {
      const val = row.querySelector("[data-envval]").value;
      if (row.dataset.env !== undefined) { present.push(row.dataset.env); env[row.dataset.env] = val === "" ? { set: true } : val; if (val !== "") changed = true; }
      else { const k = row.querySelector("[data-envkey]").value.trim(); if (k && val !== "") { env[k] = val; changed = true; } }
    }
    if (before.some(k => !present.includes(k))) changed = true; // a variable was removed
    if (changed) setPath(patch, `${base}.env`, env);
  }
}
const setMsg = (id, text, cls) => { const m = $(id); if (m) { m.textContent = text; m.className = "setmsg " + (cls || ""); } };

async function saveServerSettings() {
  const root = $("#setServer");
  let patch;
  try { patch = collectPatch(root, "server"); collectAdapters(root, patch); } catch (e) { return setMsg("#serverMsg", e.message, "bad"); }
  if (!Object.keys(patch).length) return setMsg("#serverMsg", "Nothing changed.", "");
  try {
    const r = await api("PUT", "/api/settings/server", { settings: patch });
    toast(r.restartRequired.length ? `saved; restart needed for ${r.restartRequired.join(", ")}` : "server settings saved");
    setDirty = false;
    await loadSettings(true);
    setMsg("#serverMsg", r.restartRequired.length ? `Saved. These need a restart: ${r.restartRequired.join(", ")}.` : "Saved. Agent launches from now on use the new settings.", "ok");
  } catch (e) { setMsg("#serverMsg", e.message, "bad"); }
}
async function putProject(body) {
  const pid = setView.pid;
  try {
    const r = await api("PUT", `/api/projects/${enc(pid)}/settings`, body);
    setDirty = false;
    await loadSettings(true);
    const note = r.committed ? "Saved and committed to the base branch." : `Saved to orch.config.json, not committed: ${r.reason}.`;
    setMsg("#projectMsg", note + (r.warnings.length ? "\n" + r.warnings.join("\n") : ""), r.committed && !r.warnings.length ? "ok" : "warn");
    quietRefresh();
  } catch (e) { setMsg("#projectMsg", e.message, "bad"); }
}
async function saveProjectSettings() {
  let patch;
  try { patch = collectPatch($("#setProject"), "project"); } catch (e) { return setMsg("#projectMsg", e.message, "bad"); }
  if (!Object.keys(patch).length) return setMsg("#projectMsg", "Nothing changed.", "");
  await putProject({ settings: patch });
}
async function saveProjectRaw() {
  let doc;
  try { doc = JSON.parse($("#projectRaw").value); } catch (e) { return setMsg("#projectMsg", `Not valid JSON: ${e.message}`, "bad"); }
  await putProject({ replace: true, settings: doc });
}
async function sendNotifyTest() {
  setMsg("#notifyResult", "Sending…", "");
  try {
    const r = await api("POST", "/api/settings/notify-test", {});
    setMsg("#notifyResult", r.ok ? "Sent. Check your phone." : `Failed: ${r.error}`, r.ok ? "ok" : "bad");
  } catch (e) { setMsg("#notifyResult", e.message, "bad"); }
}

setRoot().addEventListener("input", () => { setDirty = true; });
setRoot().addEventListener("click", (e) => {
  const sub = e.target.closest("[data-sub]");
  if (sub) { setSub = sub.dataset.sub; renderSettings(); return; }
  const b = e.target.closest("button[data-act]"); if (!b) return;
  const a = b.dataset.act;
  if (a === "save-server") act(saveServerSettings);
  else if (a === "save-project") act(saveProjectSettings);
  else if (a === "save-raw") act(saveProjectRaw);
  else if (a === "notify-test") act(sendNotifyTest);
  else if (a === "toggle-advanced") { const adv = $("#setProject .advanced"); adv.hidden = !adv.hidden; }
  else if (a === "env-add") { b.closest(".adapter").querySelector(".envrows").insertAdjacentHTML("beforeend", envRowNewHtml()); }
  else if (a === "env-del") { b.closest(".envrow").remove(); setDirty = true; }
});
/** An SSE `change` about settings: reload the forms unless the owner is in the middle of an edit. */
function onSettingsChange(data) {
  if (data && data.what === "settings" && !setRoot().hidden) quietSettings();
}
const quietSettings = () => loadSettings(false).catch(() => {});

// Activity: the shown run's notable events; reloaded when the shown run changes (project or run switch, reconnect).
const ACTIVITY_KINDS = ["state", "git", "error", "verdict", "decision", "question"];
async function loadActivity() {
  const rid = state.run ? state.run.id : null;
  if (rid === activityRun) return;
  activityRun = rid; activity = [];
  if (!rid) { $("#activity").innerHTML = `<div class="empty">No activity yet.</div>`; return; }
  const evs = await api("GET", `/api/runs/${enc(rid)}/events?limit=150`);
  if (activityRun !== rid) return;
  $("#activity").innerHTML = evs.filter(e => ACTIVITY_KINDS.includes(e.kind)).reverse().map(e => evLine(e, true)).join("") || `<div class="empty">No activity yet.</div>`;
}

// Live updates (§15.3): on error close the stream and retry with backoff 1 s doubling to 30 s;
// every (re)open does a full refresh, so nothing missed while disconnected stays stale.
let refreshTimer = null;
function scheduleRefresh() { clearTimeout(refreshTimer); refreshTimer = setTimeout(quietRefresh, 150); }
const BACKOFF_MIN = 1000, BACKOFF_MAX = 30000;
let es = null, sseStarted = false, backoff = BACKOFF_MIN, retryTimer = null, opened = false;
function setLive(on, title) { const l = $("#live"); l.classList.toggle("on", on); l.classList.toggle("retry", !on && !!title); l.title = title || (on ? "live" : "not connected"); }
function connect() {
  sseStarted = true;
  clearTimeout(retryTimer); retryTimer = null;
  if (es) es.close();
  const src = es = new EventSource("/api/events/stream");
  src.onopen = () => {
    if (src !== es) return;
    backoff = BACKOFF_MIN; setLive(true);
    if (opened) { activityRun = null; scheduleRefresh(); } // a reconnect: reload everything
    opened = true;
  };
  src.onerror = () => {
    if (src !== es) return;
    src.close(); // no browser auto-retry: we pace retries ourselves
    const wait = backoff; backoff = Math.min(backoff * 2, BACKOFF_MAX);
    setLive(false, `connection lost; retrying in ${wait / 1000} s`);
    clearTimeout(retryTimer); retryTimer = setTimeout(reconnect, wait);
  };
  src.addEventListener("change", (m) => { scheduleRefresh(); try { onSettingsChange(JSON.parse(m.data)); } catch { /* not JSON */ } });
  src.addEventListener("account", (m) => onAccountEvent(JSON.parse(m.data)));
  src.addEventListener("event", (m) => {
    const ev = JSON.parse(m.data);
    if (!state.run || ev.run_id !== state.run.id) return;
    if (ev.task_id === selected) appendLog([ev]);
    if (ACTIVITY_KINDS.includes(ev.kind)) {
      activity.push(ev); if (activity.length > 300) activity.shift();
      $("#activity").querySelector(".empty")?.remove();
      $("#activity").insertAdjacentHTML("afterbegin", evLine(ev, true));
      if (ev.kind === "question" || ev.kind === "state") scheduleRefresh();
    }
  });
}
// Before reopening, probe with a normal request: a 401 (token changed while away) prompts for the token,
// and login() reconnects; an unreachable daemon waits for the next, longer backoff.
async function reconnect() {
  retryTimer = null;
  let r;
  try { r = await fetch("/api/projects"); }
  catch { es = null; const wait = backoff; backoff = Math.min(backoff * 2, BACKOFF_MAX); setLive(false, `daemon unreachable; retrying in ${wait / 1000} s`); retryTimer = setTimeout(reconnect, wait); return; }
  if (r.status === 401) { es = null; login(); return; }
  connect();
}
(async () => {
  await act(refresh);
  connect();
  setInterval(quietRefresh, 30000);
})();
</script>
